name: 构建未签名IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装XcodeGen
        run: brew install xcodegen

      - name: 生成Xcode工程
        run: |
          xcodegen generate
          # 兼容Xcode15.4：将XcodeGen生成的objectVersion=77降级为56
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' GreenWiFiDemo.xcodeproj/project.pbxproj

      - name: 编译归档
        run: |
          xcodebuild archive \
            -project GreenWiFiDemo.xcodeproj \
            -scheme GreenWiFiDemo \
            -configuration Release \
            -archivePath build/GreenWiFiDemo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: ldid注入no-sandbox权限并打包IPA
        run: |
          brew install ldid
          APP_PATH="build/GreenWiFiDemo.xcarchive/Products/Applications/GreenWiFiDemo.app"
          # 用entitlements签名二进制，注入no-sandbox权限
          ldid -SGreenWiFiDemo.entitlements "$APP_PATH/GreenWiFiDemo"
          # 打包IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GreenWiFiDemo-unsigned.ipa Payload
          rm -rf Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: GreenWiFiDemo-unsigned
          path: GreenWiFiDemo-unsigned.ipa
          retention-days: 30
