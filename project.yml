name: GreenWiFiDemo
options:
  bundleIdPrefix: com.demo.greenwifi
  deploymentTarget:
    iOS: "16.0"
  generateIntermediateSchemes: false
  xcodeVersion: "15.4"
  projectFormat: "Xcode 14.0"
targets:
  GreenWiFiDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: GreenWiFiDemo
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GreenWiFiDemo
        CFBundleName: GreenWiFiDemo
        CFBundleIdentifier: com.demo.greenwifi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
